name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-image:
    runs-on: [ "self-hosted", "generic" ]
    steps:
    - uses: docker/login-action@v2
      with:
        registry: ger-is-registry.caas.intel.com
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - uses: actions/checkout@v4
    - name: Build test image
      run: make test-image
  test:
    runs-on: [ "self-hosted", "generic" ]
    needs: build-test-image
    container:
      image: ger-is-registry.caas.intel.com/dgpu-orchestration/test-image:latest
      options: --user 1001:1001
      env:
        http_proxy: http://proxy-dmz.intel.com:911
        https_proxy: http://proxy-dmz.intel.com:912
        no_proxy: 10.0.0.0/8,intel.com,*.intel.com,.intel.com
        HOME: /home/ubuntu
    steps:
    - uses: actions/checkout@v4
    - name: debug
      run: pwd && ls -l && id && env
    - name: Update vendor
      run: go mod vendor
    - name: Test
      run: make test
