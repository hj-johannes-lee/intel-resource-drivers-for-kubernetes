name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: "self-hosted"
    steps:
    - uses: actions/checkout@v4
    - name: Update vendor
      run: go mod vendor
    - name: Build
      run: make build
    - name: Test
      run: make test
