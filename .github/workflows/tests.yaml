name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-image:
    runs-on: [ "self-hosted", "generic" ]
    steps:
    - uses: docker/login-action@v2
      with:
        registry: ger-is-registry.caas.intel.com
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - uses: actions/checkout@v4
    - name: Build test image
      run: make test-image

  test:
    runs-on: [ "self-hosted", "generic" ]
    needs: build-test-image
    container:
      image: ger-is-registry.caas.intel.com/dgpu-orchestration/test-image:latest
      options: --user 1001:1001
      env:
        http_proxy: http://proxy-dmz.intel.com:911
        https_proxy: http://proxy-dmz.intel.com:912
        no_proxy: 10.0.0.0/8,intel.com,*.intel.com,.intel.com
        GOCACHE: /home/ubuntu/.cache/go-build
        GOMODCACHE: /home/ubuntu/.cache/go-mod
    steps:
    - name: test hostname
      run: hostname && ls -al /home/ubuntu/
    - uses: actions/checkout@v4
    - name: debug
      run: |
        echo "--- PWD:"
        pwd
        echo "--- LS:"
        ls -l
        echo "--- ID:"
        id
        echo "--- ENV:"
        env
        echo "--- GO ENV:"
        go env
        echo "--- HOSTNAME:"
        hostname
        echo "--- LS HOME:"
        ls -al /home/ubuntu/

    - name: Update vendor
      run: id && ls -l /home/ubuntu/.cache/ && go mod vendor
    - name: Test
      run: make test
