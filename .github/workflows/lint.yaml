name: Run lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: [self-hosted, generic]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: printEnv
        name: printEnv
        run: |
          echo "PWD: $(pwd)"
          env
          ls "$HOME"

      - name: Lint
        run: make lint
