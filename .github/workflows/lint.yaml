name: Run lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: [self-hosted, generic]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: create symlink for xpum code
        run: |
          ln -s ~/xpum ./xpumanager
      - name: Lint
        run: make lint
