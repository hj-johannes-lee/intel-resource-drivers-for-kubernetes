name: Helm Charts Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-test.yaml'
      - 'hack/kind-config.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-test.yaml'
      - 'hack/kind-config.yaml'


jobs:
  helm-test:
    runs-on: [ "self-hosted", "generic" ]
    env:
      CLUSTER_NAME: helm-test-${{ github.run_id }}
      K8S_VERSION: v1.34.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Lint all Helm charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Linting $chart"
              helm lint "$chart"
            fi
          done

      - name: Install Kind
        run: |
          if ! command -v kind &> /dev/null; then
            echo "Kind not found. Downloading..."
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          else
            echo "Kind already installed:"
            kind version
          fi


      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "kubectl not found. Downloading..."
            curl -LO "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          else
            echo "kubectl already installed:"
            kubectl version --client
          fi

      - name: Create kind cluster with custom config
        run: |
          echo "Creating cluster: $CLUSTER_NAME"
          kind create cluster \
            --name "$CLUSTER_NAME" \
            --image kindest/node:${K8S_VERSION} \
            --config hack/kind-config.yaml
          kubectl cluster-info

      - name: Build Helm dependencies
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Building dependencies for $chart"
              helm dependency update "$chart"
            fi
          done
      
      - name: Install NFD chart
        run: |
          helm repo add nfd https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update
          helm install nfd nfd/node-feature-discovery --wait --timeout 180s

      - name: Install and test charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              chart_name=$(basename "$chart")
              release_name="${chart_name}-test"
              echo "Installing $chart_name ..."
              helm install "$release_name" "$chart" --wait --timeout 180s
              echo "Checking resources for $chart_name"
              kubectl get all -A
              echo "Uninstalling $chart_name"
              helm uninstall "$release_name"
            fi
          done

      - name: Clean up Kind cluster
        if: always()
        run: |
          echo "Cleaning up cluster $CLUSTER_NAME..."
          kind delete cluster --name $CLUSTER_NAME
          echo "Cluster removed."
