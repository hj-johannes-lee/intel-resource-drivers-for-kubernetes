name: Build-and-push-container

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-container:
    runs-on: "self-hosted"
    steps:
    - uses: actions/checkout@v4
    - name: Update vendor
      run: go mod vendor
    - run: |
       echo "ref: ${{ github.ref }}"
       echo "ref_name: ${{ github.ref_name }}"
    - name: Populate licenses
      run: |
        make licenses
    - uses: docker/login-action@v2
      with:
        registry: ger-is-registry.caas.intel.com
        username: ${{ secrets.CAAS_USER }}
        password: ${{ secrets.SYS_GACO2 }}
    - name: Build and push GPU resource driver image
      run: |
        GPU_IMAGE_TAG=ger-is-registry.caas.intel.com/dgpu-orchestration/intel-gpu-resource-driver:devel make container-push
