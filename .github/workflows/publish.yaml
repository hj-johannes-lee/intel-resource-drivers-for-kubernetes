name: Build-and-push-container

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-container:
    runs-on: "self-hosted"
    steps:
    - uses: actions/checkout@v4
    - name: Update vendor
      run: go mod vendor
    - run: |
       echo "ref: ${{ github.ref }}"
       echo "ref_name: ${{ github.ref_name }}"
    - name: Populate licenses
      run: |
        make licenses
    - uses: docker/login-action@v2
      with:
        registry: ger-is-registry.caas.intel.com
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - name: Build and push GPU resource driver image
      run: |
        make cleanall
        GPU_IMAGE_TAG=ger-is-registry.caas.intel.com/dgpu-orchestration/intel-gpu-resource-driver:devel make gpu-container-push
    - name: Build and push Gaudi resource driver image
      run: |
        make cleanall
        GAUDI_IMAGE_TAG=ger-is-registry.caas.intel.com/dgpu-orchestration/intel-gaudi-resource-driver:devel make gaudi-container-push
    - name: Build and push QAT resource driver image
      run: |
        make cleanall
        QAT_IMAGE_TAG=ger-is-registry.caas.intel.com/dgpu-orchestration/intel-qat-resource-driver:devel make qat-container-push
